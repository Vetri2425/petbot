name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native unit tests
        run: pio test -e native
      - name: Build
        run: pio run -e esp32-s3-devkitc-1
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32-s3-devkitc-1
          path: firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin
          if-no-files-found: error

  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  face-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: |
          cmake -S sim/face_sim -B sim/face_sim/build -DCMAKE_BUILD_TYPE=Release
          cmake --build sim/face_sim/build -j "$(nproc)"
      - name: Render snapshots
        run: SDL_VIDEODRIVER=dummy sim/face_sim/build/face_sim --snapshot face-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: face-snapshots
          path: face-snapshots/*.png
          if-no-files-found: error
