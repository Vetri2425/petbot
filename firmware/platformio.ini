; PetBot firmware: ESP32-S3 DevKitC-1 N16R8 (16MB flash, 8MB octal PSRAM)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; LVGL: same pinned version as sim/face_sim. It finds include/lv_conf.h via LV_CONF_INCLUDE_SIMPLE.
lib_deps =
  lvgl/lvgl@9.5.0
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude

; Host-run unit tests for the platform-independent code: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<protocol.cpp>
build_flags =
  -std=c++11
  -Wall
  -Wextra
